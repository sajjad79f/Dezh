[workspace]
resolver = "2"

members = [

    "contracts",
    "shared-kernel",

    "bootstrap",

    "core/def",
    "core/dai",
    "core/dkg",
    "core/die",
    "core/dde",

    "dcm",
    "api",
    "storage",

    "modules/monitoring",
    "modules/firewall",
    "modules/vpn",
    "modules/automation",
    "modules/siem",
    "modules/nac",
    "modules/ids",
    "modules/ips",
    "modules/routing",
    "modules/accounting",

    "agents/windows-agent",
    "agents/linux-agent",
    "agents/discovery-agent",
]

[workspace.package]
edition = "2024"
version = "0.1.0-alpha"
authors = ["Dezh Team"]
license = "Proprietary"

[workspace.dependencies]
anyhow = "1"
thiserror = "2"

tokio = { version = "1", features = ["full"] }

serde = { version = "1", features = ["derive"] }
serde_json = "1"

axum = "0.7"

uuid = { version = "1", features = ["v4", "serde"] }

chrono = { version = "0.4", features = ["serde"] }

async-trait = "0.1"

tracing = "0.1"
tracing-subscriber = "0.3"

once_cell = "1"
parking_lot = "0.12"